name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.7'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build

      - name: Check Python Syntax (Compile)
        run: |
          uv run --no-sync python -m compileall -q app/

      - name: Run Mypy (Type Checking)
        run: |
          uv run --no-sync mypy app/

  test:
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.7'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build

      - name: Prepare Environment for Tests
        run: |
          cp .env.example .env

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: |
          uv run --no-sync python -m pytest tests/ -q --tb=short --cov=app --cov-report=xml
