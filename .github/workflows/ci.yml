name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Check Python Syntax (Compile)
        run: |
          python -m compileall -q app/

      - name: Run Mypy (Type Checking)
        run: |
          mypy app/

  test:
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Environment for Tests
        run: |
          cp .env.example .env

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -q --tb=short --cov=app/features/ --cov=app/shared/ --cov-report=xml
