name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff (Linting)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .

      - name: Check Python Syntax (Compile)
        run: |
          python -m compileall -q app/

      - name: Prepare Environment for Tests
        run: |
          cp .env.example .env

      - name: Run Pytest Coverage
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/services/ --cov=app/services/ --cov-report=xml --cov-report=term-missing
