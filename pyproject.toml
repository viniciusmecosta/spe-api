[project]
name = "spe"
version = "1.0.1"
description = "Sistema de Ponto Eletrônico"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "granian>=2.8.1",
    "hashids>=1.3.1",
    "httpx>=0.28.1",
    "ntplib>=0.4.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-escpos>=3.1",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "reportlab>=5.0.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
    "tzlocal>=5.4.4",
    "watchfiles>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.4.0",
    "httpx2>=2.10.0",
]

[tool.mypy]
plugins = [
  "pydantic.mypy",
  "sqlalchemy.ext.mypy.plugin"
]
ignore_missing_imports = true
disable_error_code = [
  "arg-type",
  "union-attr",
  "attr-defined",
  "assignment",
  "call-arg",
  "return-value",
  "var-annotated",
  "import-untyped",
  "valid-type",
  "operator",
  "type-var",
  "annotation-unchecked",
  "dict-item",
  "list-item",
  "misc"
]

