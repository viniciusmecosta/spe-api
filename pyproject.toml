[project]
name = "spe"
version = "2.0.3"
description = "Sistema de Ponto Eletrônico"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "psycopg2-binary>=2.9.13",
    "apscheduler>=3.11.3",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.5",
    "granian>=2.8.8",
    "hashids>=1.3.1",
    "httpx>=0.28.1",
    "ntplib>=0.4.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-escpos>=3.1",
    "python-multipart>=0.0.33",
    "qrcode>=8.2",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "starlette>=1.10.0",
    "tzlocal>=5.4.5",
    "watchfiles>=1.3.0",
    "cryptography>=50.0.2",
    "limits>=5.8,<6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "coverage>=7.17.2,<7.17.3",
    "pytest-mock>=3.17.0",
    "pytest-asyncio>=1.4.1.post1",
    "httpx2>=2.16.0",
    "aiosqlite>=0.22.1",
    "mypy>=2.3.0",
    "ruff==0.17.2",
]

[tool.mypy]
plugins = [
    "pydantic.mypy",
]

ignore_missing_imports = true
disable_error_code = [
    "arg-type",
    "union-attr",
    "attr-defined",
    "assignment",
    "call-arg",
    "return-value",
    "var-annotated",
    "import-untyped",
    "valid-type",
    "operator",
    "type-var",
    "annotation-unchecked",
    "dict-item",
    "list-item",
    "misc"
]

[tool.coverage.run]
source = ["app", "alembic"]
relative_files = true

