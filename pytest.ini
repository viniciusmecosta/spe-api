[pytest]
addopts = --cov=app --cov=scripts --cov=alembic --cov-report=term-missing
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::ResourceWarning
    ignore::DeprecationWarning
    ignore::UserWarning
